
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>بطاقتك العالمية للتوفير</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background: linear-gradient(to bottom, #f0f0f0, #e0e0e0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
      max-width: 450px;
    }
    h1 {
      color: #222;
      font-size: 22px;
    }
    p {
      color: #444;
      margin: 20px 0;
      font-size: 16px;
    }
    a.btn {
      display: inline-block;
      background: #000;
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 16px;
    }
    a.btn:hover {
      background: #444;
    }
    footer {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>وفر أكثر… اتصل عالمياً</h1>
    <p>eSIM يوفر لك تغطية دولية بأسعار منافسة، بدون شريحة فعلية أو عقود.</p>
    <a href="https://voyafly.com/ma" class="btn" target="_blank">اطلب الآن</a>
    <footer>© مشروع كحيلان العالمي</footer>
  </div>
</body>
</html>
